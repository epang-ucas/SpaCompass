# SpaCompass release environment.
#
#   conda env create -f environment.yml
#   conda activate spacompass
#
# R + r-mclust + rpy2 are needed for the mclust clustering protocol
# (scripts/clustering_test.py --method mclust) and for --method leiden/louvain
# they can be dropped.
name: spacompass
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  # Required by some prebuilt torch wheels (for example aarch64 builds) that do
  # not bundle a BLAS implementation.
  - libopenblas
  - libgfortran5
  - libgcc-ng
  - libstdcxx-ng
  # Optional: mclust clustering protocol.
  - r-base=4.4
  - r-mclust=6.1.1
  - rpy2
  # scikit-misc has no aarch64 wheel on PyPI; conda-forge builds are available.
  - scikit-misc=0.5.1
  - pip:
      - torch==2.4.1
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.15.2
      - scikit-learn==1.5.2
      - anndata==0.11.3
      - scanpy==1.11.0
      - scib==1.1.7
      - matplotlib==3.10.1
      - tqdm==4.67.1
      - einops==0.8.1
      - POT==0.9.5
      - python-igraph==0.11.8
      - leidenalg==0.10.2
      # Pinned because the scIB clustering metrics (NMI, ARI, graph
      # connectivity, isolated-label F1) depend on the approximate kNN graph
      # built by scanpy/pynndescent: other versions change those numbers
      # slightly even though the embeddings are identical.
      - numba==0.61.0
      - llvmlite==0.44.0
      - pynndescent==0.5.13
      - umap-learn==0.5.7
      - h5py==3.13.0
      - statsmodels==0.14.4
      - joblib==1.4.2
      - deprecated==1.2.18
      - pydot==3.0.4
      - pillow==11.1.0
      - session-info2==0.1.2
      - legacy-api-wrap==1.4.1
      - patsy==1.0.1
      - wrapt==1.17.2
